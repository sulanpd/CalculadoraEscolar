<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Idade Escolar</title>
    <!-- Carregar a fonte Inter do Google Fonts para uma aparência moderna -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            box-sizing: border-box;
            /* Usar a fonte Inter com fallbacks */
            font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #2563eb 0%, #1e40af 100%);
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .calculator-container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            max-width: 500px;
            width: 100%;
            text-align: center;
        }

        .title {
            color: #1f2937;
            font-size: 2rem;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #6b7280;
            font-size: 1rem;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        /* Estilos das Abas */
        .tabs {
            display: flex;
            margin-bottom: 25px;
            background: #f3f4f6;
            border-radius: 12px;
            padding: 5px;
        }
        .tab-btn {
            flex: 1;
            padding: 12px 10px;
            border: none;
            border-radius: 9px;
            background: transparent;
            color: #6b7280;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .tab-btn.active {
            background: #ffffff;
            color: #2563eb;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
        }

        .input-group {
            margin-bottom: 25px;
            text-align: left;
        }

        .input-label {
            display: block;
            color: #1f2937;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 1rem;
        }

        .date-input {
            width: 100%;
            padding: 15px;
            border: 2px solid #d1d5db;
            border-radius: 12px;
            font-size: 1rem;
            transition: all 0.3s ease;
            box-sizing: border-box; /* Garante que o padding não afete a largura */
        }

        .date-input:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        /* Estilo para a mensagem de erro */
        .error-message {
            color: #ef4444; /* Cor vermelha para erro */
            font-size: 0.9rem;
            margin-top: -15px; /* Puxa para cima, para mais perto do input */
            margin-bottom: 20px;
            display: none; /* Oculto por padrão */
            text-align: left;
            padding-left: 5px;
        }
        
        .error-message.show {
            display: block;
            animation: slideIn 0.3s ease; /* Mesma animação do resultado */
        }

        /* Grupo de Botões */
        .button-group {
            display: flex;
            gap: 15px;
            margin-top: 20px; 
        }

        .calculate-btn {
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            color: white;
            border: none;
            padding: 15px 20px;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            flex-grow: 2; /* Faz o botão de calcular ser maior */
            order: 2; /* Coloca o botão de calcular em segundo */
        }

        .calculate-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(37, 99, 235, 0.3);
        }
        
        .clear-btn {
            background: #f3f4f6;
            color: #4b5563;
            border: 2px solid #e5e7eb;
            padding: 15px 20px;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            flex-grow: 1; /* Botão de limpar é menor */
            order: 1; /* Coloca o botão de limpar em primeiro */
        }
        .clear-btn:hover {
            background: #e5e7eb;
            transform: translateY(-2px);
        }

        .result-card {
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            color: white;
            padding: 30px;
            border-radius: 15px;
            margin-top: 30px; /* Aumentar espaço do botão */
            display: none;
            text-align: left; /* Alinhar texto do resultado à esquerda */
        }

        .result-card.show {
            display: block;
            animation: slideIn 0.5s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .age-display {
            font-size: 2.5rem;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .grade-display {
            font-size: 1.5rem;
            font-weight: 600;
            background: rgba(255, 255, 255, 0.2);
            padding: 15px;
            border-radius: 10px;
            margin-top: 15px;
        }

        .reference-info {
            background: #f8fafc;
            border-left: 4px solid #2563eb;
            padding: 20px;
            margin-top: 30px; /* Aumentar espaço */
            border-radius: 8px;
            text-align: left;
        }

        .reference-title {
            font-weight: 600;
            color: #1f2937;
            margin-bottom: 10px;
        }

        .grade-table {
            font-size: 0.9rem;
            color: #6b7280;
            line-height: 1.6;
        }

        /* Ajustes para telas menores */
        @media (max-width: 600px) {
            .calculator-container {
                padding: 30px 20px;
            }
            
            .title {
                font-size: 1.5rem;
            }
            
            .age-display {
                font-size: 2rem;
            }

            .grade-display {
                font-size: 1.25rem;
            }
        }
    </style>
</head>
<body>
    <div class="calculator-container">
        <h1 class="title">📚 Calculadora de Idade Escolar</h1>
        <p class="subtitle">Descubra a idade atual e a série escolar correspondente, ou projete para 2026, com base na data de referência de 31 de março.</p>
        
        <!-- Abas de seleção de ano -->
        <div class="tabs">
            <button class="tab-btn active" data-year="current">Ano Atual</button>
            <button class="tab-btn" data-year="2026">Projeção 2026</button>
        </div>

        <div class="input-group">
            <label for="birthDate" class="input-label">Data de Nascimento da Criança:</label>
            <input type="date" id="birthDate" class="date-input" required>
        </div>
        
        <!-- Div para exibir a mensagem de erro -->
        <div id="error-message" class="error-message"></div>
        
        <!-- Grupo de Botões -->
        <div class="button-group">
            <button onclick="clearData()" class="clear-btn">Limpar</button>
            <button onclick="calculateAge()" class="calculate-btn">Calcular</button>
        </div>
        
        <div id="result" class="result-card">
            <div id="ageResult" class="age-display"></div>
            <div id="gradeResult" class="grade-display"></div>
        </div>
        
        <div class="reference-info">
            <div class="reference-title">📅 Referência - 31 de Março</div>
            <div class="grade-table">
                <strong>4 Anos:</strong> Pré 1<br>
                <strong>5 Anos:</strong> Pré 2<br>
                <strong>6 Anos:</strong> 1º Ano<br>
                <strong>7 Anos:</strong> 2º Ano<br>
                <strong>8 Anos:</strong> 3º Ano<br>
                <strong>9 Anos:</strong> 4º Ano<br>
                <strong>10 Anos:</strong> 5º Ano
            </div>
        </div>
    </div>

    <script>
        // Variável global para o ano de referência, inicializada com o ano atual
        let selectedReferenceYear = new Date().getFullYear();

        function calculateAge() {
            const birthDateInput = document.getElementById('birthDate');
            const resultDiv = document.getElementById('result');
            const ageResultDiv = document.getElementById('ageResult');
            const gradeResultDiv = document.getElementById('gradeResult');
            const errorDiv = document.getElementById('error-message'); // Seleciona a div de erro
            
            if (!birthDateInput.value) {
                // Em vez de alert(), exibe a mensagem na div de erro
                errorDiv.textContent = 'Por favor, selecione a data de nascimento da criança.';
                errorDiv.classList.add('show');
                resultDiv.classList.remove('show'); // Esconde o resultado se houver erro
                return;
            }
            
            // Esconde a mensagem de erro se a data foi preenchida
            errorDiv.classList.remove('show');
            
            const birthDate = new Date(birthDateInput.value);
            const today = new Date();
            
            // --- Calcular idade atual ---
            let currentAge = today.getFullYear() - birthDate.getFullYear();
            const monthDiff = today.getMonth() - birthDate.getMonth();
            
            if (monthDiff < 0 || (monthDiff === 0 && today.getDate() < birthDate.getDate())) {
                currentAge--;
            }
            
            // --- Calcular idade na data de referência (USA selectedReferenceYear) ---
            // Mês é 2 para Março (Janeiro=0, Fevereiro=1, Março=2)
            const schoolReferenceDate = new Date(selectedReferenceYear, 2, 31); 
            let ageOnReference = schoolReferenceDate.getFullYear() - birthDate.getFullYear();
            const refMonthDiff = schoolReferenceDate.getMonth() - birthDate.getMonth();
            
            if (refMonthDiff < 0 || (refMonthDiff === 0 && schoolReferenceDate.getDate() < birthDate.getDate())) {
                ageOnReference--;
            }
            
            // --- Determinar série baseada na idade em 31 de março ---
            const gradeMap = {
                4: 'Pré 1',
                5: 'Pré 2',
                6: '1º Ano',
                7: '2º Ano',
                8: '3º Ano',
                9: '4º Ano',
                10: '5º Ano'
            };
            
            const grade = gradeMap[ageOnReference] || 'Fora da faixa (4-10 anos)';
            
            // --- Exibir resultados ---
            ageResultDiv.innerHTML = `Idade Atual: ${currentAge} anos`;
            // Atualiza o ano de referência no texto do resultado
            gradeResultDiv.innerHTML = `Série: ${grade}<br><small>Baseado na idade de ${ageOnReference} anos em 31/03/${selectedReferenceYear}</small>`;
            
            resultDiv.classList.add('show');
        }

        // Nova função para limpar os dados
        function clearData() {
            const birthDateInput = document.getElementById('birthDate');
            const resultDiv = document.getElementById('result');
            const errorDiv = document.getElementById('error-message');
            
            birthDateInput.value = ''; // Limpa o campo de data
            resultDiv.classList.remove('show'); // Esconde o card de resultado
            errorDiv.classList.remove('show'); // Esconde a mensagem de erro
            
            birthDateInput.focus(); // Coloca o foco de volta no campo de data
        }
        
        // Permitir calcular ao pressionar Enter no campo de data
        document.getElementById('birthDate').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                calculateAge();
            }
        });

        // --- Lógica das Abas ---
        // Adiciona os event listeners após o carregamento do DOM
        document.addEventListener('DOMContentLoaded', () => {
            const tabs = document.querySelectorAll('.tab-btn');
            
            tabs.forEach(tab => {
                tab.addEventListener('click', () => {
                    // Remover 'active' de todas as abas
                    tabs.forEach(t => t.classList.remove('active'));
                    // Adicionar 'active' à aba clicada
                    tab.classList.add('active');
                    
                    // Atualizar o ano de referência global
                    const yearType = tab.getAttribute('data-year');
                    if (yearType === 'current') {
                        selectedReferenceYear = new Date().getFullYear();
                    } else {
                        selectedReferenceYear = parseInt(yearType, 10);
                    }
                    
                    // Opcional: recalcula automaticamente se já houver uma data inserida
                    const birthDateInput = document.getElementById('birthDate');
                    if (birthDateInput.value) {
                        calculateAge();
                    }
                });
            });
        });
    </script>
</body>
</html>
